<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mai Nhật Thành - 20235431</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 560px;
      width: 100%;
      overflow: hidden;
    }

    header {
      background: #2d3561;
      color: #ffffff;
      padding: 32px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.85;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffffff;
      color: #2d3561;
      font-size: 32px;
      font-weight: bold;
      line-height: 90px;
      margin: 0 auto 16px;
    }

    .content {
      padding: 28px 24px;
    }

    h2 {
      font-size: 18px;
      color: #2d3561;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eeeeee;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid #eeeeee;
      font-size: 15px;
    }

    th {
      width: 45%;
      color: #555555;
      font-weight: 600;
    }

    td {
      color: #1a1a1a;
    }

    tr:last-child th,
    tr:last-child td {
      border-bottom: none;
    }

    footer {
      background: #f7f7fa;
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: #777777;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 22px; }
      th, td { font-size: 14px; display: block; width: 100%; }
      th { padding-bottom: 2px; border-bottom: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="avatar">MNT</div>
      <h1>MAI NHẬT THÀNH</h1>
      <p>Sinh viên - Đại học Bách khoa Hà Nội</p>
    </header>

    <div class="content">
      <h2>Thông tin sinh viên</h2>
      <table>
        <tr>
          <th>Họ và tên</th>
          <td>Mai Nhật Thành</td>
        </tr>
        <tr>
          <th>Mã số sinh viên</th>
          <td>20235431</td>
        </tr>
        <tr>
          <th>Mã học phần</th>
          <td>IT4409</td>
        </tr>
        <tr>
          <th>Mã lớp</th>
          <td>172920</td>
        </tr>
      </table>
    </div>

    <footer>
      Bài tập 1 - Công nghệ Web và Dịch vụ trực tuyến
    </footer>
  </div>
</body>
</html>
