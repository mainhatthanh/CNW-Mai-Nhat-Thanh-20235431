<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Example Complete Form</title>
</head>

<body>

  <h2>Registration Form</h2>

  <form action="/submit" method="POST" name="completeForm">

    <label for="name">Name:</label>
    <input type="text" id="name" name="username" required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="1" max="120">
    <br><br>

    <label for="birthdate">Birthdate:</label>
    <input type="date" id="birthdate" name="birthdate">
    <br><br>

    <p>Gender:</p>
    <input type="radio" id="male" name="gender1" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender2" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender3" value="other">
    <label for="other">Other</label>
    <br><br>

    <p>Interests:</p>
    <input type="checkbox" id="sports" name="interest" value="sports">
    <label for="sports">Sports</label>
    <input type="checkbox" id="music" name="interest" value="music">
    <label for="music">Music</label>
    <input type="checkbox" id="reading" name="interest" value="reading">
    <label for="reading">Reading</label>
    <br><br>

    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="usa">USA</option>
      <option value="uk">UK</option>
      <option value="canada">Canada</option>
      <option value="australia">Australia</option>
    </select>
    <br><br>

    <label for="comments">Comments:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>

</body>

</html>
